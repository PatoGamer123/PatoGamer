name: Empaquetar Onda LAN
on:
  push:
    paths: ['acuario-y-onda/Onda/**']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - name: Construir paquete portátil
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cd acuario-y-onda/Onda
          mkdir classes,input
          javac --release 8 -encoding UTF-8 -d classes src/onda/lan/Room.java src/onda/lan/DesktopApp.java
          jar --create --file input/onda.jar --main-class onda.lan.DesktopApp -C classes . -C assets room.html
          jpackage --type app-image --input input --name OndaLAN --main-jar onda.jar --main-class onda.lan.DesktopApp --dest pack --add-modules java.desktop --app-version 1.0
          Compress-Archive pack/OndaLAN ../../OndaLAN-Windows-x64.zip
      - name: Publicar descarga
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create onda-lan-1.0 OndaLAN-Windows-x64.zip --title "Onda LAN 1.0" --notes "Paquete portátil para Windows x64."
