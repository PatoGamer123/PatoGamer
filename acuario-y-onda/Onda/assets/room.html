<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onda LAN</title><style>*{box-sizing:border-box}body{margin:0;background:#122726;color:#effaf4;font:18px system-ui,sans-serif}main{max-width:760px;margin:7vh auto;padding:24px}h1{font-size:3em;margin:0;color:#95edc6}section{background:#203936;padding:22px;margin-top:18px;border-radius:16px}h2{margin:0 0 16px;font-size:1.2em}button,a,input{font:inherit}button,a{display:inline-block;background:#acf1cc;color:#15382d;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;text-decoration:none}input{max-width:100%;margin-bottom:12px}li{margin:12px 0;overflow-wrap:anywhere}:focus-visible{outline:4px solid orange}small{color:#bbd2c9}progress{width:100%}</style><main><h1>Onda LAN</h1><p>Comparte archivos con quienes tengan el enlace de esta sala.</p><section><h2>Enviar archivos</h2><input id="files" type="file" multiple><br><button id="send">Enviar a la sala</button><p id="status" role="status"></p><progress id="bar" max="100" value="0" hidden></progress><small>256 MiB por archivo · 512 MiB por sala</small></section><section><h2>Archivos para descargar</h2><ul id="list"></ul><small id="info">Conectando…</small></section></main><script>
var el=function(id){return document.getElementById(id)},last=null;
function refresh(){var x=new XMLHttpRequest();x.open('GET','list');x.onload=function(){if(x.status!==200){el('info').textContent='Sala no disponible';return}var t=x.responseText;el('info').textContent=t?'Selecciona un archivo para guardarlo.':'Todavía no hay archivos.';if(t===last)return;last=t;el('list').textContent='';t.trim().split('\n').filter(Boolean).forEach(function(row){var p=row.split(' '),a=document.createElement('a'),li=document.createElement('li');a.href='get/'+p[0];a.textContent=decodeURIComponent(p[2].replace(/\+/g,' '))+' · '+Math.ceil(Number(p[1])/1024)+' KiB';li.appendChild(a);el('list').appendChild(li)})};x.onerror=function(){el('info').textContent='Sin conexión con la sala.'};x.send()}
el('send').onclick=function(){var batch=Array.prototype.slice.call(el('files').files);if(!batch.length){el('status').textContent='Elige un archivo primero.';return}el('send').disabled=true;function done(msg){el('status').textContent=msg;el('send').disabled=false;el('bar').hidden=true;refresh()}function next(){if(!batch.length){el('files').value='';done('Envío completo.');return}var f=batch.shift();if(f.size>268435456){done('Supera 256 MiB: '+f.name);return}var x=new XMLHttpRequest();x.open('POST','send');x.setRequestHeader('X-Onda','1');x.setRequestHeader('X-Name',encodeURIComponent(f.name));el('status').textContent='Enviando '+f.name;el('bar').hidden=false;el('bar').value=0;x.upload.onprogress=function(e){if(e.total)el('bar').value=100*e.loaded/e.total};x.onload=function(){if(x.status===201){refresh();next()}else done(x.responseText||'Error de envío')};x.onerror=function(){done('Se perdió la conexión.')};x.send(f)}next()};refresh();setInterval(refresh,3500)
</script></html>
